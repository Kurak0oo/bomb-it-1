name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [headless, rendered]
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        if: matrix.mode == 'headless'
        run: python -m pip install -r tools/requirements.txt
      - name: Install pinned Linux engine
        if: matrix.mode == 'headless'
        shell: bash
        run: |
          version=$(cat tools/godot-version.txt)
          asset="Godot_v${version}-stable_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl --fail --location --retry 3 "$base/$asset" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$base/SHA512-SUMS.txt" -o "$RUNNER_TEMP/SHA512-SUMS.txt"
          cp "$RUNNER_TEMP/godot.zip" "$RUNNER_TEMP/$asset"
          (cd "$RUNNER_TEMP" && grep " $asset\$" SHA512-SUMS.txt | sha512sum --check --strict -)
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v${version}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Headless suites
        if: matrix.mode == 'headless'
        run: python tools/run_checks.py
      - name: Rendered regression checks
        if: matrix.mode == 'rendered'
        run: |
          docker build -t bomb-it-checks -f tools/ci/Dockerfile .
          mkdir -p .artifacts/checks
          docker run --rm --init -v "$PWD/.artifacts/checks:/artifacts" bomb-it-checks
      - name: Preserve logs and comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ matrix.mode }}
          path: .artifacts/checks
          if-no-files-found: error
